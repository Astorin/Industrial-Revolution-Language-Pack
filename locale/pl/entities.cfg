[entity-description]
accepted-types=[font=default-semibold][color=255,230,192]Dozwolone:[/color][/font]
air-compressor=Elektryczna sprężarka powietrza. Tworzy sprężone powietrze poprzez filtrowanie lokalnej atmosfery, zmniejszając zanieczyszczenie powietrza.
air-purifier=Elektryczny oczyszczacz powietrza. Filtruje lokalną atmosferę, zmniejszając zanieczyszczenie.
arc-furnace=Zaawansowany piec elektryczny. Produkuje stopione metale do odlewu lub stopowania. Wymagany ręczny wybór receptur.
arc-turret=Zakłóca system nerwowy żywych celów, spowalniając je. Nie powoduje żadnych uszkodzeń.
assembling-machine-1=Zasilany parą automat montażowy. Ubija rzeczy w kształt za pomocą narzędzi lumpen.
assembling-machine-2=Elektryczny automat montażowy. Używa narzędzi do produkcji komponentów.
assembling-machine-3=Zaawansowany automat montażowy. Używa narzędzi do szybkiego wytwarzania komponentów.
barrelling-machine=Elektryczny kontroler płynów. Automatycznie napełnia lub opróżnia kanistry i beczki. Użyj __CONTROL__ir-entity-adjustment__ aby przełączać się między trybami opróżniania i napełniania.
blast-furnace=Piec spalinowy. Przetwarza stal, żelazo, miedź i krzem. Wymaga koksu jako paliwa. Wbudowane premie szybkości i produktywności. Wymaga sprężonego powietrza przed umieszczeniem przedmiotów.
bottomless-pit=Głęboka, ciemna dziura w ziemi. Każdy przedmiot rzucony wewnątrz jest na zawsze zagubiony. Sloty można filtrować za pomocą __CONTROL__toggle-filter__.
bronze-forestry=Hodowla drzew. Przerób skaluje się z liczbą drzew na tej samej działce (do osiągnięcia limitu). Oczyszcza powietrze. Wymaga wody, ale nie wymaga energii.
bronze-alloy-furnace=Piec spalinowy. Łączy pośrednie materiały. Wymagany jest ręczny wybór receptury.
bronze-furnace=Piec zapłonowy. Wytapia materiały pośrednie.
bronze-telescope=Skaner parowy. Mapuje zdalne sektory i ujawnia niewielki lokalny obszar.
burner-inserter=Podajniki spalinowe mogą również zasilać siebie z szczeliny paliwowej pieców i innych maszyn.
burner-mining-drill=Wiertnica napędzana spalinowo. Nie może wydobywać złóż, które wymagają płynnego rozpuszczalnika.
chrome-drill=Ogromna wiertnica elektryczna. Może używać rozpuszczalnika górniczego.
chrome-forestry=Przyspieszona hodowla drzew. Przerób skaluje się z liczbą drzew na tej samej działce (do osiągnięcia limitu). Oczyszcza powietrze. Wymaga płynnego nawozu, dwutlenku węgla oraz elektryczności.
chrome-press=Elektryczna prasa. Wytwarza kryształy przemysłowe poprzez zastosowanie ogromnego ciśnienia.
chrome-transmat=Transmaterializator między lokalizacjami. Szczegółowe informacje można znaleźć w instrukcji technicznej TP-PLZ.
copper-aetheric-lamp=Wykorzystuje parę i miedzianych prętów do wytworzenia nieziemskiego blasku. Jak to działa? Nikt naprawdę nie wie. Użyj / __CONTROL__ir-entity-adjustment__ __CONTROL__ir2-entity-adjustment__, aby przełączać się między wariantem przepływowym i terminalnym. Wybierz i skonfiguruj lampę, aby wybrać kolor, lub użyj __CONTROL__larger-terrain-building-area__ / __CONTROL__smaller-terrain-building-area__, aby przełączać kolory.
copper-boiler=Spala paliwo aby przekształcić wodę w parę.
copper-derrick=Pompa na parę. Może być ustawiona jedynie w ujściach pary. Samonapędzająca się.
copper-grinder=Napędzana parą kruszarka. Kruszy rudę, zwiększając wydajność i może przetwarzać również inne zasoby.
copper-lab=Obiekt badawczy napędzany parą wodną.\n__1__ __2__
copper-mixer=Napędzany parą mikser. Specjalna kruszarka, która miksuje rafinowane składniki do dalszego przetwarzania.
electric-alloy-furnace=Piec elektryczny. Łączy zaawansowane materiały. Wymagany jest ręczny wybór receptury.
electric-furnace=Piec elektryczny. Wytapia zaawansowane materiały.
electric-mining-drill=Wiertnica elektryczna. Może używać rozpuszczalnika górniczego.
gear-wheel-cast=Odlew kół zębatych. Użyj __CONTROL__ir-entity-adjustment__ aby zmienić typ odlewu.
gun-turret=Automatyczne działko maszynowe. Projekt wydaje się dziwnie znajomy.
heavy-picket=Szybki pojazd konstrukcyjny napędzany efektem polowym. Zasilany tylko bateryjnie. Nieuzbrojony. Duża siatka wyposażenia. Pokonuje akweny wodne. Taranue drzewa. Nieruchomy na pasach transmisyjnych.
heavy-roller=Ciężki, wolny pojazd budowlany. Brak broni. Średni ekwipunek. Rozbija i zbiera drzewa. Nieruchomy na pasach transmisyjnych.
ingot-cast=Odlew sztabek. Użyj __CONTROL__ir-entity-adjustment__ aby zmienić typ odlewu.
ir-adjust-inserters=Dostosuj, po której stronie pasa upuszcza ten podajnik za pomocą __CONTROL__ir2-entity-adjustment__.
iron-air-compressor=Filtry i sprężarki powietrza, dostosowane do rurociągów. Zmniejszają lokalne zanieczyszczenia.
iron-battery-charger=Ładuje baterie z niewielkim prawdopodobieństwem ich awarii. Naładowane baterie mogą być używane w sprzęcie osobistym, pojazdach, lokomotywach i bateryjnych generatorach.
iron-battery-discharger=Uwalnia energię magazynowaną w naładowanych bateriach i ogniwach do użytku w sieci lokalnej. Użyj __CONTROL__ir-entity-adjustment__ aby przełączać się pomiędzy domyślnym niskim priorytetem (równoważnym akumulatorom) i wyższym priorytetem (będzie ładować akumulatory).
iron-flare-stack=Pozbywa się produktów ropopochodnych, powodując zanieczyszczenie.
iron-forestry=Przyspieszona hodowla drzew. Przerób skaluje się z liczbą drzew na tej samej działce (do osiągnięcia limitu). Oczyszcza powietrze. Wymaga wody oraz elektryczności.
iron-gas-vent=Odprowadza gazy do atmosfery. Współczynnik zanieczyszczenia zależy od gazu.
iron-geothermal-exchanger=Elektryczny zespół pompy i wymiennika ciepła. Wykorzystuje zanieczyszczoną parę wodną ze źródeł geotermalnych do ogrzewania czystej wody. Użyj __CONTROL__ir-entity-adjustment__ aby przełączać się między ciepłą wodą a parą wodną.
iron-grinder=Elektryczna kruszarka. Kruszy rudę, zwiększając wydajność i może przetwarzać również inne zasoby.
iron-mixer=Mikser elektryczny. Specjalna kruszarka, która miksuje rafinowane składniki do dalszego przetwarzania.
iron-scrapper=Elektryczny recykler. Niszczy przedmioty, produkując złom. Przyjmuje każdy przedmiot wykonany z metalu, szkła, drewna, kamienia lub betonu. Efektywność odzysku wynosi średnio 75%.
iron-washer=Elektryczny oczyszczacz rudy. Wydobywa minerały z rud metalonośnych, z dodatkową szansą na produkty uboczne.
lab-inputs=[font=default-semibold][color=255,230,192]Wejścia:[/color][/font]
lab=Obiekt badawczy napędzany elektrycznością.\n__1__ __2__
laser-assembler=Laserowy automat montażowy. Używa laserów do wytwarzania bardzo złożonych lub wytrzymałych komponentów.
laser-turret=Działko laserowe z automatycznym celowaniem. Pif, paf.
locomotive=Obsługuje automatyczne harmonogramy i ciągnie tabor kolejowy. Otwórz menu pociągu za pomocą __CONTROL__build__. Możesz przełączać tryb ręczny / automatyczny pociągu za pomocą __CONTROL__ir2-entity-adjustment__.
module-loader=Elektryczna jednostka transferu danych. Programuje moduły znacznie szybciej niż człowiek.
monowheel=Dziwaczny pojazd osobisty. Bardzo szybki. Brak broni. Minimalna ładowność.
output-priority-high=Wysoka
output-priority-low=Niska
output-priority=__1__\n[font=default-semibold][color=255,230,192]Priorytet wyjścia:[/color][/font] __2__
photon-turret=Potężna wieża obronna średniego zasięgu.\n Użyj n__CONTROL__rotate__ / __CONTROL__reverse-rotate__ aby obrócić. \n__CONTROL__ir-entity-adjustment__ przełącza szerokość obszaru ognia. \n[font=default-semibold][color=255,230,192]Uwaga:[/color][/font] [img=virtual-signal/ir-signal-danger] Obrażenia uderzeniowe
pipes-all=Każdy płyn
pipes=[font=default-semibold][color=255,230,192]Transportuje:[/color][/font] __1__
plate-cast=Odlew płytek. Użyj __CONTROL__ir-entity-adjustment__ aby zmienić typ odlewu.
quantum-lab=Zaawansowany obiekt badawczy. Dodatkowe miejsca na moduły.\n__1__ __2__
racing-monowheel=Wysoka prędkość maksymalna i doskonałe hamulce. Brak broni i minimalna ładowność. Wejdź do monocyklu używając __CONTROL__toggle-driving__.
radar=Skaner elektryczny. Mapuje zdalne sektory i ujawnia średniej wielkości lokalny obszar.
robotower=Podstawowy roboport o ograniczonym zasięgu, ale niewielkich rozmiarach.
rod-cast=Odlew prętów. Użyj __CONTROL__ir-entity-adjustment__ aby zmienić typ odlewu.
scattergun-turret=Powolna, ale brutalna obrona przed intruzami.
small-assembler-1=Mały parowy automat montażowy. Obsługuje podzbiór prostych przepisów składowych.
small-assembler-2=Mały elektryczny automat montażowy. Obsługuje podzbiór prostych przepisów składowych.
small-assembler-3=Mały zaawansowany automat montażowy. Obsługuje podzbiór prostych przepisów składowych.
small-tank=[font=default-semibold][color=255,230,192]Przechowuje:[/color][/font] __1__
solar-array=Wytwarza energię elektryczną ze światła słonecznego. Korzyści skali oznaczają więcej mocy na mniejszej przestrzeni.
steam-barrelling-machine=Wlot/dysza pod ciśnieniem. Napełnia lub opróżnia ogniwa parowe. Nie wymaga zasilania. Użyj __CONTROL__ir-entity-adjustment__ aby przełączać się pomiędzy trybem opróżniania i napełniania.
steam-drill=Wiertnica napędzana parowo. Łączy się z rurami parowymi, ale nie może wydobywać rud, które wymagają płynnego rozpuszczalnika.
steam-inserter=Wymaga dopływu pary.
steel-boiler=Elektryczny podgrzewacz wody. Użyj __CONTROL__ir-entity-adjustment__ aby przełączać się między ciepłą wodą a parą. Nie nadaje się do wytwarzania energii.
steel-cleaner=Elektryczny filtr rurowy. Usuwa zanieczyszczenia z zabrudzonej wody. Tworzy śluz, z którym należy się uporać.
steel-cryo-tower=Elektryczny zakład upłynniania. Rozdziela, schładza i kondensuje gazy.
steel-derrick=Elektryczna pompa głębinowa. Może być ustawiona w ujściu dowolnego gazu.
steel-electroplater=Elektryczna maszyna do galwanizacji. Pokrywa metalowe elementy warstwami metalu ochronnego. Roztwór do powlekania może przepływać do sąsiadujących maszyn. Płyn jest wymagany przed włożeniem przedmiotów.
steel-furnace=Piec spalinowy. Wytapia zaawansowane materiały.
petro-generator=Generator elektryczny. Wytwarza energię spalając węglowodory płynne.
steel-grinder=Zaawansowana Elektryczna kruszarka. Zdolny do kruszenia najtwardszych materiałów.
steel-mixer=Zaawansowany mikser elektryczny. Wyspecjalizowana kruszarka do mieszania rafinowane składniki do dalszego przetwarzania.
steel-vaporiser=Blok transferu cieplnego. Ogrzewa skroplone gazy do temperatury pokojowej, zwiększając ich objętość. Dodatkowo skrapla parę wodną. Nie wymaga zasilania.
steel-washer=Elektryczny oczyszczacz rud. Wydziela minerały z rud metali z szansą na produkty uboczne. Przed włożeniem materiału musi zostać wtłoczona zimna lub gorąca woda.
stone-charcoal-kiln=Piec wolnego spalania, który przetwarza drewno w węgiel drzewny.
stone-furnace=Piec do spalania. Wytapia podstawowe materiały.
stone-alloy-furnace=Piec spalinowy. Łączy podstawowe materiały. Wymagany jest ręczny wybór receptury.
storage-tank-pollution=[img=virtual-signal/ir-signal-warning] Uwalnia zanieczyszczenia w przypadku dekonstrukcji lub spłukiwania.
supermagnet=Generator pola magnetycznego o dużej mocy.
tree-planter-rubber-wood=Pozwala na umieszczanie (i planowanie schematów) kauczukowca, do użytku z leśniczego lub dekoracyjnego. Po dekonstrukcji pozostawia składniki.
tree-planter-wood=Pozwala na umieszczanie i planowanie schematów drzew, do użytku z leśniczego lub dekoracyjnego. Po dekonstrukcji pozostawia składniki.
valve=Rura o ograniczonym przepływie. Użyj __CONTROL__ir-entity-adjustment__ aby przełączać się pomiędzy trybem jednokierunkowym, nadmiaru i uzupełnienia. (skonsultuj się ze stroną Manifestu dotyczącą skrótu klawiszowego przełączania).
waterfill-explosive=Gdy materiał wybuchowy zostanie umieszczony na ziemi na wybrzeżu wody, po opóźnieniu zostanie on uzbrojony i wybuchnie, wypełniając kwadrat pod spodem wodą do kolan i uzbrajając wszelkie przyległe materiały wybuchowe, które również wybuchną po krótszym czasie.
transfer-plate=Aktywuje przeładunek przedmiotów filtrowanych do- i ze- zbiorników w zasięgu, podczas przechodzenia i przejeżdżania po nich. Skonsultuj Manifest.
hidden-entity=Ten przedmiot ma ustawione flagi "ukryte" i "niedokończone" i nie powinien być wyświetlany w GUI.
rocket-turret=Prowadzi ostrzały rakietowe z opcjonalnym filtrem celów. Użyj __CONTROL__ir-entity-adjustment__ aby przełączać ignorowane cele (słabi wrogowie lub brak).
rocket-turret-ignore=[font=default-semibold][color=255,230,192]Ignorowane:[/color][/font] __1__
rocket-turret-none=Brak
rocket-turret-low-health=Cele poniżej __1__ zdrowia

